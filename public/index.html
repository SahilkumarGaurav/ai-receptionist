<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RapidFlow Plumbing - Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
:root{--bg:#f5f7fa;--card:#fff;--border:#e0e4eb;--text:#1e293b;--muted:#64748b;--primary:#1a56db;--primary-h:#1649c0;--danger:#ef4444;--success:#10b981;--warn:#f59e0b}
body{background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:1.25rem;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.card h2{font-size:1rem;font-weight:600;margin-bottom:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat{padding:16px;background:var(--bg);border-radius:8px}
.stat .val{font-size:2rem;font-weight:700}
.stat .lbl{font-size:.85rem;color:var(--muted);margin-top:4px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:end}
.toolbar input,.toolbar select{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:.9rem}
.toolbar input[type=text]{min-width:250px}
.toolbar select{min-width:140px}
.btn{padding:10px 16px;border-radius:8px;font-weight:500;font-size:.9rem;border:none;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-h)}
.btn-danger{background:var(--danger);color:#fff}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;font-size:.9rem;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;background:var(--bg)}
tr:hover td{background:#fafbfc}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:500}
.badge-emergency{background:#fef2f2;color:var(--danger)}
.badge-urgent{background:#fffbeb;color:var(--warn)}
.badge-standard{background:#ecfdf5;color:var(--success)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.loading{text-align:center;padding:40px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;opacity:0;visibility:hidden;transition:.2s}
.modal.open{opacity:1;visibility:visible}
.modal-box{background:var(--card);border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto;transform:scale(.95);transition:transform .2s}
.modal.open .modal-box{transform:scale(1)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:1.1rem;font-weight:600}
.modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--muted);line-height:1;padding:4px}
.modal-body{padding:20px}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row.single{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
label{font-size:.85rem;font-weight:500}
input,select,textarea{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,86,219,.15)}
textarea{min-height:80px;resize:vertical}
@media(max-width:700px){.form-row{grid-template-columns:1fr}header h1{font-size:1rem}}
</style>
</head>
<body>
<header>
<h1>RapidFlow Plumbing</h1>
</header>
<main>
<div class="card stats" id="stats">
<div class="stat"><div class="lbl">This Month</div><div class="val" id="s-bookings">—</div></div>

<div class="stat"><div class="lbl">Emails Sent</div><div class="val" id="s-emails">—</div></div>
<div class="stat"><div class="lbl">Customers</div><div class="val" id="s-cust">—</div></div>
</div>

<div class="card">
<h2>Bookings</h2>
<div class="toolbar">
<input type="text" id="search" placeholder="Search name, phone, email...">
<select id="month"><option value="">All Months</option></select>
<select id="year"><option value="">All Years</option></select>
<select id="status"><option value="">All Status</option><option value="upcoming">Upcoming</option><option value="past">Past</option></select>
<button class="btn btn-primary" id="new-btn">+ New Booking</button>
</div>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Date & Time</th><th>Customer</th><th>Service</th><th>Phone</th><th>Address</th><th>Urgency</th><th>Actions</th></tr></thead>
<tbody id="tbody"><tr><td colspan="7" class="loading">Loading...</td></tr></tbody>
</table>
</div>
<div style="display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap">
<button class="btn btn-secondary" id="prev" disabled>Previous</button>
<span id="pageinfo" style="display:flex;align-items:center;color:var(--muted);font-size:.9rem">Page 1</span>
<button class="btn btn-secondary" id="next" disabled>Next</button>
</div>
</div>
</main>

<div class="modal" id="modal">
<div class="modal-box">
<div class="modal-head"><h3 id="mtitle">New Booking</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
<form id="form" class="modal-body">
<input type="hidden" name="event_id" id="eid">
<div class="form-row">
<div class="form-group"><label>Customer Name *</label><input type="text" name="customer_name" required></div>
<div class="form-group"><label>Phone *</label><input type="tel" name="phone" required placeholder="(555) 123-4567"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Email</label><input type="email" name="email" placeholder="customer@email.com"></div>
<div class="form-group"><label>Service Type *</label><select name="service_type" id="svc" required></select></div>
</div>
<div class="form-row single"><div class="form-group"><label>Service Address *</label><input type="text" name="service_address" required placeholder="123 Main St, City, State"></div></div>
<div class="form-row single"><div class="form-group"><label>Problem Description *</label><textarea name="problem_description" required placeholder="Describe the plumbing issue..."></textarea></div></div>
<div class="form-row">
<div class="form-group"><label>Urgency *</label><select name="urgency" required><option value="standard">Standard</option><option value="urgent">Urgent</option><option value="emergency">Emergency</option></select></div>
<div class="form-group"><label>Preferred Date *</label><input type="date" name="preferred_date" id="pdate" required></div>
<div class="form-group"><label>Preferred Time *</label><input type="time" name="preferred_time" id="ptime" required></div>
</div>
</form>
<div class="modal-foot">
<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
<button class="btn btn-primary" form="form" id="fsubmit">Create Booking</button>
</div>
</div>
</div>

<div class="modal" id="vmodal">
<div class="modal-box" style="max-width:600px">
<div class="modal-head"><h3>Booking Details</h3><button class="modal-close" onclick="closeVModal()">&times;</button></div>
<div class="modal-body" id="vbody"></div>
<div class="modal-foot"><button class="btn btn-secondary" onclick="closeVModal()">Close</button></div>
</div>
</div>

<div class="modal" id="cmodal">
<div class="modal-box" style="max-width:420px">
<div class="modal-head"><h3>Confirm Cancel</h3><button class="modal-close" onclick="closeCModal()">&times;</button></div>
<div class="modal-body"><p style="color:var(--muted)">Cancel this booking? This cannot be undone.</p></div>
<div class="modal-foot"><button class="btn btn-secondary" onclick="closeCModal()">Keep</button><button class="btn btn-danger" id="ccancel">Cancel Booking</button></div>
</div>
</div>

<script>
const SERVICES=['leak repair','clogged drain','toilet repair','water heater','faucet repair','sink repair','sewer service','pipe repair','pipe replacement','water pressure','no hot water','installation','inspection','emergency plumbing','general plumbing'];
let page=1,filters={search:'',month:'',year:'',status:''},delId=null;

function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function fmt(d,o={}){return new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true,...o})}
function fmtT(d){return new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})}
function badge(u){const c={emergency:'badge-emergency',urgent:'badge-urgent',standard:'badge-standard'}[(u||'standard').toLowerCase()];return `<span class="badge ${c}">${(u||'standard').charAt(0).toUpperCase()+(u||'standard').slice(1)}</span>`}
function toast(m,t='info'){const d=document.createElement('div');d.style.cssText='position:fixed;bottom:20px;right:20px;z-index:999;padding:12px 20px;border-radius:8px;background:#fff;border:1px solid var(--border);box-shadow:0 10px 25px rgba(0,0,0,.1);max-width:350px';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}

async function api(method,url,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},credentials:'include',body:body?JSON.stringify(body):null});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||`HTTP ${r.status}`)}return r.json()}

function openModal(edit=null){
$('#form').reset();$('#eid').value='';$('#mtitle').textContent=edit?'Edit Booking':'New Booking';$('#fsubmit').textContent=edit?'Update Booking':'Create Booking';
if(edit){const b=edit;$('#eid').value=b.google_event_id||'';$('#form').customer_name.value=b.patient_name;$('#form').phone.value=b.patient_phone||'';$('#form').email.value=b.customer_email||'';$('#form').service_address.value=b.service_address||b.customer_address||'';$('#form').service_type.value=b.service_name||'';$('#form').problem_description.value=b.problem_description||'';$('#form').urgency.value=b.urgency||'standard';if(b.start_time){const d=new Date(b.start_time);$('#pdate').value=d.toISOString().split('T')[0];$('#ptime').value=d.toTimeString().slice(0,5);}}else{const t=new Date();t.setDate(t.getDate()+1);$('#pdate').value=t.toISOString().split('T')[0];$('#ptime').value='09:00';}
$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}

function openView(b){$('#vbody').innerHTML=`<div style="display:grid;gap:10px"><div><b>Event ID:</b> ${b.google_event_id}</div><div><b>Customer:</b> ${b.patient_name}</div><div><b>Phone:</b> ${b.patient_phone||'—'}</div><div><b>Email:</b> ${b.customer_email||'—'}</div><div><b>Service:</b> ${b.service_name||'—'}</div><div><b>Address:</b> ${b.service_address||b.customer_address||'—'}</div><div><b>Problem:</b> ${b.problem_description||'—'}</div><div><b>Urgency:</b> ${badge(b.urgency)}</div><div><b>Date & Time:</b> ${fmt(b.start_time)}</div><div><b>End:</b> ${fmtT(b.end_time)}</div><div><b>Email Sent:</b> ${b.email_sent?'Yes':'No'}</div><div><b>Created:</b> ${fmt(b.created_at)}</div></div>`;$('#vmodal').classList.add('open')}
function closeVModal(){$('#vmodal').classList.remove('open')}

function openConfirm(id){delId=id;$('#cmodal').classList.add('open')}
function closeCModal(){delId=null;$('#cmodal').classList.remove('open')}

async function loadStats(){
try{const [a,e,c]=await Promise.all([api('GET','/api/analytics'),api('GET','/api/emails'),api('GET','/api/customers')]);
$('#s-bookings').textContent=a.monthly_bookings||0;$('#s-emails').textContent=e.sent||0;$('#s-cust').textContent=c.length||0;
const g=a.growth??0;}catch(err){console.error(err);toast('Failed to load stats','error')}}

async function loadBookings(){
  // Clear table and disable pagination while loading
  $('#tbody').innerHTML='<tr><td colspan="7" class="loading">Loading...</td></tr>';
  $('#prev').disabled=true;$('#next').disabled=true;

  try{
    const params={page,limit:10,...filters};
    if(filters.month) params.month=+filters.month;
    if(filters.year) params.year=+filters.year;
    const query = new URLSearchParams(params).toString();
    const data = await api('GET','/api/records?' + query);
    const rows=data.records||[];
    if(!rows.length){
      $('#tbody').innerHTML='<tr><td colspan="7" class="empty">No bookings found</td></tr>';
      $('#pageinfo').textContent='Page 1';
      return;
    }
    // Store rows in a map for quick lookup when viewing details
    const bookingMap = {};
    $('#tbody').innerHTML=rows.map(b=>{
      bookingMap[b.google_event_id]=b;
      return `<tr>
        <td><b>${fmt(b.start_time,{hour:undefined,minute:undefined})}</b><br><small style="color:var(--muted)">${fmtT(b.start_time)} - ${fmtT(b.end_time)}</small></td>
        <td>${b.patient_name}</td>
        <td>${b.service_name||'—'}</td>
        <td>${b.patient_phone||'—'}</td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.service_address||b.customer_address||'—'}</td>
        <td>${badge(b.urgency)}</td>
        <td>
          <button class="btn btn-secondary btn-sm view-btn" data-id="${b.google_event_id}" style="padding:6px 10px;font-size:.8rem">View</button>
          <button class="btn btn-danger btn-sm cancel-btn" data-id="${b.google_event_id}" style="padding:6px 10px;font-size:.8rem">Cancel</button>
        </td>
      </tr>`;
    }).join('');
    // Attach click handlers after rows are in the DOM
    document.querySelectorAll('.view-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{ const b=bookingMap[btn.dataset.id]; if(b) openView(b); });
    });
    document.querySelectorAll('.cancel-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{ openConfirm(btn.dataset.id); });
    });
    $('#pageinfo').textContent=`Page ${page}`;
    $('#prev').disabled=page<=1;
    $('#next').disabled=rows.length<10;
  }catch(err){
    console.error(err);
    $('#tbody').innerHTML='<tr><td colspan="7" class="empty">Failed to load</td></tr>';
    toast('Failed to load bookings','error');
  }
}

async function submitForm(e){
e.preventDefault();
const fd=new FormData($('#form'));
const data=Object.fromEntries(fd);
if(data.event_id){try{await api('DELETE',`/api/bookings?event_id=${encodeURIComponent(data.event_id)}`)}catch{toast('Failed to update','error');return}}
try{const r=await api('POST','/api/bookings',data);if(r.success){toast(data.event_id?'Booking updated':'Booking created','success');closeModal();loadBookings();loadStats()}else toast(r.message||'Failed','error')}catch(err){toast(err.message,'error')}}

async function doCancel(){
if(!delId)return;
$('#ccancel').disabled=true;$('#ccancel').textContent='Cancelling...';
try{await api('DELETE',`/api/bookings?event_id=${encodeURIComponent(delId)}`);toast('Booking cancelled','success');closeCModal();delId=null;loadBookings();loadStats()}catch(err){toast(err.message,'error')}finally{$('#ccancel').disabled=false;$('#ccancel').textContent='Cancel Booking'}}

function initFilters(){
const now=new Date();
const m=$('#month'),y=$('#year');
for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),i,1);const o=document.createElement('option');o.value=i+1;o.textContent=d.toLocaleString('en-US',{month:'long'});if(i===now.getMonth())o.selected=true;m.appendChild(o)}
for(let i=now.getFullYear()-2;i<=now.getFullYear()+1;i++){const o=document.createElement('option');o.value=i;o.textContent=i;if(i===now.getFullYear())o.selected=true;y.appendChild(o)}
filters.month=now.getMonth()+1;filters.year=now.getFullYear();}

function init(){
$('#svc').innerHTML='<option value="">Select...</option>'+SERVICES.map(s=>`<option value="${s}">${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
initFilters();
loadStats();loadBookings();
$('#new-btn').onclick=()=>openModal();
$('#form').onsubmit=submitForm;
$('#search').addEventListener('input',()=>{filters.search=$('#search').value.trim();page=1;loadBookings()});
$('#month').onchange=()=>{filters.month=$('#month').value;page=1;loadBookings()};
$('#year').onchange=()=>{filters.year=$('#year').value;page=1;loadBookings()};
$('#status').onchange=()=>{filters.status=$('#status').value;page=1;loadBookings()};
$('#prev').onclick=()=>{if(page>1){page--;loadBookings()}};
$('#next').onclick=()=>{page++;loadBookings()};
$('#ccancel').onclick=doCancel;
$$('.modal').forEach(m=>m.onclick=e=>{if(e.target===m){m.id==='modal'?closeModal():m.id==='vmodal'?closeVModal():closeCModal()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeVModal();closeCModal()}});
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
